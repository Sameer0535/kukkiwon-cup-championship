<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Crisp authentic Kukkiwon official federation colors -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B3F"/>
      <stop offset="50%" stop-color="#BA9035"/>
      <stop offset="100%" stop-color="#A57D28"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="50%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0080B7"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F5E"/>
      <stop offset="100%" stop-color="#081E3D"/>
    </linearGradient>

    <!-- Clip path for the overall banner silhouette: concave top and bottom, flared sides -->
    <clipPath id="bannerClip">
      <path d="M 50,45 
               C 350,110 650,110 950,45 
               C 960,180 960,300 950,435 
               C 650,370 350,370 50,435 
               C 40,300 40,180 50,45 Z" />
    </clipPath>
  </defs>

  <!-- Group clipped to the iconic Kukkiwon banner shape -->
  <g clip-path="url(#bannerClip)">
    <!-- 1. Gold / Bronze Upper Field -->
    <path d="M 20,20 L 980,20 L 980,460 L 20,460 Z" fill="url(#goldGrad)" />

    <!-- 2. Cyan / Bright Blue Lower Left Wave -->
    <path d="M 40,140 
             C 40,140 100,280 280,340 
             C 380,375 480,375 520,360
             C 440,360 380,320 320,290 
             C 200,230 110,210 40,140 Z" 
          fill="url(#cyanGrad)" />

    <!-- Cyan lower-left corner fill -->
    <path d="M 40,140 
             C 110,210 200,230 320,290 
             C 380,320 440,360 520,360 
             C 400,390 200,410 40,440 Z" 
          fill="url(#cyanGrad)" />

    <!-- 3. Deep Navy Taegeuk Wave flowing through center to bottom-right -->
    <path d="M 960,180 
             C 960,180 880,360 620,180 
             C 480,80 430,220 530,290 
             C 630,360 820,360 960,440 Z" 
          fill="url(#navyGrad)" />
  </g>
</svg>
